services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shot-creative-agent-demo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Shot Creative Agent Demo}"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-shot_creative}
      DB_USERNAME: ${DB_USERNAME:-shot_creative}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-shot-creative}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-shot-creative-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-shot-creative-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-shot-creative}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-replay}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-3.5-flash-lite}
      JUDGE_GEMINI_MODEL: ${JUDGE_GEMINI_MODEL:-gemini-3.5-flash-lite}
      JUDGE_OPENAI_MODEL: ${JUDGE_OPENAI_MODEL:-gpt-5.4-mini}
      JUDGE_VIDEO_FPS: ${JUDGE_VIDEO_FPS:-6}
      JUDGE_MAX_FRAMES: ${JUDGE_MAX_FRAMES:-48}
      JUDGE_REQUESTS_PER_MINUTE: ${JUDGE_REQUESTS_PER_MINUTE:-10}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      AGENT_REQUESTS_PER_MINUTE: ${AGENT_REQUESTS_PER_MINUTE:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - .:/var/www/html
      # Container-local modules. npm install must not write Linux binaries over the host folder.
      - frontend_node_modules:/var/www/html/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  horizon:
    image: shot-creative-agent-demo-app
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_NAME: "${APP_NAME:-Shot Creative Agent Demo}"
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-shot_creative}
      DB_USERNAME: ${DB_USERNAME:-shot_creative}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-shot-creative}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-shot-creative-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-shot-creative-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-shot-creative}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-replay}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-3.5-flash-lite}
      JUDGE_GEMINI_MODEL: ${JUDGE_GEMINI_MODEL:-gemini-3.5-flash-lite}
      JUDGE_OPENAI_MODEL: ${JUDGE_OPENAI_MODEL:-gpt-5.4-mini}
      JUDGE_VIDEO_FPS: ${JUDGE_VIDEO_FPS:-6}
      JUDGE_MAX_FRAMES: ${JUDGE_MAX_FRAMES:-48}
      JUDGE_REQUESTS_PER_MINUTE: ${JUDGE_REQUESTS_PER_MINUTE:-10}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      AGENT_REQUESTS_PER_MINUTE: ${AGENT_REQUESTS_PER_MINUTE:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  reverb:
    image: shot-creative-agent-demo-app
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    environment:
      APP_NAME: "${APP_NAME:-Shot Creative Agent Demo}"
      APP_ENV: local
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-shot-creative}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-shot-creative-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-shot-creative-secret}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shot_creative}
      POSTGRES_USER: ${DB_USERNAME:-shot_creative}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory under this mount
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shot_creative}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Community build of MinIO: upstream stopped publishing minio/minio images
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  # One-shot: create the app's bucket so a fresh minio_data volume works.
  # Without it every S3 write fails silently and muxing finds no clips.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        max_attempts=60
        attempt=1
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "MinIO not reachable after $$max_attempts attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 1
        done
        mc mb --ignore-existing "local/$$AWS_BUCKET"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-shot-creative}
    depends_on:
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
